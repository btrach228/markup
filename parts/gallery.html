<section id="gallery" class="gallery">
  <div class="container gallery-wrapper">
    <div class="gallery-wrapper_text row row-title">
      <h2 class="text-center">Our Gallery</h2>
      <p class="text-center">Check out our latest projects and creations!</p>
    </div>
    <div class="row">
      <div class="col gallery-images">
        <div class="gallery-images-left">
          <img src=".././assets/img/g1.jpg" alt="Image" />
          <img src=".././assets/img/g2.jpg" alt="Image" />
        </div>
        <div class="gallery-images-right">
          <img src=".././assets/img/g3.jpg" alt="Image" />
          <div class="gallery-images-right-bottom">
            <img src=".././assets/img/g4.jpg" alt="Image" />
            <img src=".././assets/img/g5.jpg" alt="Image" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="carouselExample" class="carousel slide">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src=".././assets/img/g1.jpg" class="d-block w-100" alt="..." />
      </div>
      <div class="carousel-item">
        <img src=".././assets/img/g2.jpg" class="d-block w-100" alt="..." />
      </div>
      <div class="carousel-item">
        <img src=".././assets/img/g3.jpg" class="d-block w-100" alt="" />
      </div>
      <div class="carousel-item">
        <img src=".././assets/img/g4.jpg" class="d-block w-100" alt="..." />
      </div>
      <div class="carousel-item">
        <img src=".././assets/img/g5.jpg" class="d-block w-100" alt="..." />
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExample"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExample"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</section>
